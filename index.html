<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b1f3b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>أحمد علوكه</title>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1b1f3b;--ink2:#2a2f57;--gold:#b8892b;--bg:#eef0f6;--card:#fff;--line:#d9dde9;--debt:#b3261e;--pay:#1f7a4d;--mute:#6b7089}
*{box-sizing:border-box;margin:0}
body{font-family:Cairo,system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding-bottom:100px}
header{background:var(--ink);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px;padding-top:calc(10px + env(safe-area-inset-top,0px))}
header svg{width:42px;height:42px;flex:none}
header b{font-size:18px;display:block;line-height:1.2}header small{color:#cbb27a;font-size:12px}
main{max-width:620px;margin:0 auto;padding:14px}
h2{font-size:16px;margin:18px 0 8px}
.hero{background:linear-gradient(150deg,var(--ink2),var(--ink));color:#fff;border-radius:16px;padding:18px;border-top:4px solid var(--gold)}
.hero small{color:#cbb27a}.hero strong{display:block;font-size:34px;line-height:1.3}.hero em{font-style:normal;color:#e6d4a3}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.box small{color:var(--mute);display:block}.box strong{font-size:18px}
input,select{font:inherit;width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.list{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px;background:var(--card);border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.nm{font-weight:600}.ph{font-size:13px;color:var(--mute)}
.amt{font-weight:700;text-align:left;line-height:1.3}
.owe{color:var(--debt)}.ok{color:var(--pay)}.late{color:var(--debt);font-size:12px;font-weight:600}.soon{color:var(--gold);font-size:12px;font-weight:600}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:11px 14px;background:var(--ink);color:#fff;font-weight:600}
button.gold{background:var(--gold)}button.red{background:var(--debt)}button.green{background:var(--pay)}button.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
button.wa{padding:8px 12px;background:#fff;color:var(--pay);border:1px solid var(--pay);flex:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:12px 0}
.tabs button{background:#fff;color:var(--mute);border:1px solid var(--line)}.tabs button.on{background:var(--ink);color:#fff}
.empty{padding:26px 16px;text-align:center;color:var(--mute)}
.chart{display:flex;align-items:flex-end;gap:8px;height:120px;padding:8px 4px 0}
.chart div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--mute)}
.bars{display:flex;align-items:flex-end;gap:2px;height:96px;width:100%;justify-content:center}
.bars i{display:block;width:40%;min-height:2px;border-radius:3px 3px 0 0}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);align-items:end;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:4}
nav button{background:none;color:var(--mute);padding:6px 0;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:8px}
nav button.on{color:var(--ink)}nav button.on svg{stroke:var(--gold)}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav .plus{background:var(--gold);color:#fff;width:56px;height:56px;border-radius:50%;margin:-26px auto 0;font-size:30px;line-height:1;display:block;box-shadow:0 4px 12px rgba(27,31,59,.3)}
.sheet{position:fixed;inset:0;background:rgba(27,31,59,.55);display:none;align-items:flex-end;justify-content:center;z-index:9}
.sheet.on{display:flex}
.sheet>div{background:#fff;width:100%;max-width:620px;border-radius:18px 18px 0 0;padding:18px;display:grid;gap:10px;max-height:92vh;overflow:auto;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
.sheet label{font-size:14px;color:var(--mute)}
.tx{display:flex;justify-content:space-between;gap:8px;padding:11px 12px;background:var(--card);border-bottom:1px solid var(--line)}
.tx small{color:var(--mute);display:block}
.tx button{padding:4px 9px;background:#fff;color:var(--debt);border:1px solid var(--line);align-self:center}
@media (prefers-reduced-motion:no-preference){.sheet>div{animation:up .18s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.5}}}
.num{display:inline-block;min-width:26px;padding:1px 7px;margin-left:8px;border-radius:999px;background:#eee3c3;color:#7a5a12;font-size:12px;font-weight:700;text-align:center}
.what{font-size:13px;color:#7a5a12;margin-top:2px;font-weight:600}
</style>
</head>
<body>
<header>
<svg viewBox="0 0 120 120" role="img" aria-label="العلي"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3d98b"/><stop offset="1" stop-color="#b8892b"/></linearGradient></defs><circle cx="60" cy="60" r="56" fill="#232850" stroke="url(#g)" stroke-width="3"/><circle cx="60" cy="60" r="49" fill="none" stroke="url(#g)" stroke-width=".8" stroke-dasharray="2 4"/><path d="M30 30Q60 18 90 30M30 92Q60 104 90 92" fill="none" stroke="url(#g)" stroke-width="1.6"/><text x="60" y="73" text-anchor="middle" font-family="Aref Ruqaa,serif" font-size="38" fill="url(#g)">العلي</text></svg>
<div><b>أحمد علوكه</b><small>دفتر ديون الزبائن</small></div>
</header>
<main id="app"></main>
<nav id="nav"></nav>
<div class="sheet" id="sheet"><div id="sheetBody"></div></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {initializeFirestore,persistentLocalCache,persistentMultipleTabManager,collection,doc,setDoc,deleteDoc,onSnapshot} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const fb=initializeApp({apiKey:"AIzaSyDf_VnDfJNWgKSLJtFsIeeOVosSXPcivVk",authDomain:"alouka-debts.firebaseapp.com",projectId:"alouka-debts",storageBucket:"alouka-debts.firebasestorage.app",messagingSenderId:"278486865299",appId:"1:278486865299:web:6e496af2641f4c3d474466"});
const auth=getAuth(fb),db=initializeFirestore(fb,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});
const KEY='alouka_v1';
let S={customers:[]},tab='home',view=null,cvTab='open',q='',user=null,guest=false,synced={},unsub=null,unsubCfg=null,first=true;
try{const r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}
const CK='alouka_cfg';
let cfg={shop:'',sig:'العلي لخدمات الإنترنت',phone:''};
try{const r=localStorage.getItem(CK);if(r)cfg={...cfg,...JSON.parse(r)}}catch(e){}
const saveCfg=()=>{try{localStorage.setItem(CK,JSON.stringify(cfg))}catch(e){}if(user)setDoc(doc(db,'users',user.uid,'settings','main'),cfg).catch(e=>console.error(e))};
const local=JSON.parse(JSON.stringify(S));
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert('تعذّر الحفظ على هذا الجهاز')}
  if(!user)return;
  const ids={};
  S.customers.forEach(c=>{ids[c.id]=1;const j=JSON.stringify(c);if(synced[c.id]!==j){synced[c.id]=j;setDoc(doc(db,'users',user.uid,'customers',c.id),JSON.parse(j)).catch(e=>console.error(e))}});
  Object.keys(synced).forEach(id=>{if(!ids[id]){delete synced[id];deleteDoc(doc(db,'users',user.uid,'customers',id)).catch(e=>console.error(e))}})};
const $=s=>document.querySelector(s);
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n).toLocaleString('en-US');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const cu=c=>c==='USD'?' $':' د.ع';
const D=86400000,now=new Date(),T=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime();
const dueMs=t=>t.due?new Date(t.due+'T00:00:00').getTime():0;
const bal=c=>{const b={IQD:0,USD:0};c.tx.forEach(t=>b[t.cur]+=t.type==='debt'?t.amt:-t.amt);return b};
const balTxt=b=>{const p=[];if(b.IQD>0)p.push(fmt(b.IQD)+' د.ع');if(b.USD>0)p.push(fmt(b.USD)+' $');return p.join(' + ')||'مسدَّد'};
function opens(c){const out=[];['IQD','USD'].forEach(cur=>{let pay=0;c.tx.forEach(t=>{if(t.cur===cur&&t.type==='pay')pay+=t.amt});c.tx.filter(t=>t.cur===cur&&t.type==='debt').sort((a,b)=>a.ts-b.ts).forEach(t=>{const u=Math.min(pay,t.amt);pay-=u;if(t.amt-u>0)out.push({...t,rem:t.amt-u,cid:c.id,cn:c.name,cno:c.no})})});return out}
const isLate=o=>o.due&&dueMs(o)<T;
const dueTxt=o=>{if(!o.due)return '';const d=Math.round((dueMs(o)-T)/D);return d<0?'<span class="late">متأخر '+(-d)+' يوم</span>':d===0?'<span class="soon">يستحق اليوم</span>':d<=7?'<span class="soon">يستحق بعد '+d+' يوم</span>':'<span class="ph">يستحق '+o.due+'</span>'};
function sheet(title,fields,ok,label){
  $('#sheetBody').innerHTML='<b>'+esc(title)+'</b>'+fields.map(f=>'<div><label>'+f.l+'</label>'+(f.o?'<select id="f_'+f.k+'">'+f.o.map(o=>'<option value="'+esc(o[0])+'">'+esc(o[1])+'</option>').join('')+'</select>':'<input id="f_'+f.k+'" type="'+(f.t||'text')+'" inputmode="'+(f.m||'text')+'" value="'+esc(f.v||'')+'">')+'</div>').join('')+'<button class="gold" id="okb">'+(label||'حفظ')+'</button><button class="ghost" id="cn">إلغاء</button>';
  $('#sheet').classList.add('on');fields.forEach(f=>{if(f.o&&f.v!=null)$('#f_'+f.k).value=f.v});$('#cn').onclick=close;
  $('#okb').onclick=()=>{const v={};fields.forEach(f=>v[f.k]=$('#f_'+f.k).value.trim());if(ok(v)!==false)close()};
  const f=$('#sheetBody input,#sheetBody select');if(f)f.focus();
}
const close=()=>$('#sheet').classList.remove('on');
$('#sheet').onclick=e=>{if(e.target.id==='sheet')close()};
const dig=s=>String(s??'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
const num=s=>parseFloat(dig(s).replace(/[,٬،\s]/g,''));
const norm=s=>String(s||'').replace(/[\u064B-\u065F\u0670\u0640]/g,'').replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي').replace(/\s+/g,' ').trim().toLowerCase();
function lev(a,b){const m=a.length,n=b.length;if(Math.abs(m-n)>1)return 2;const d=[...Array(m+1)].map((_,i)=>[i]);for(let j=1;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
const toks=s=>s.split(' ').sort().join(' ');
function similar(name,exceptId){
  const x=norm(name),res=[];if(!x)return res;
  S.customers.forEach(c=>{if(c.id===exceptId)return;const y=norm(c.name);if(!y)return;
    if(x===y)res.push({c,t:'same'});
    else if((x.length>=4&&y.length>=4&&lev(x,y)<=1)||toks(x)===toks(y)||(x.startsWith(y+' ')&&y.includes(' '))||(y.startsWith(x+' ')&&x.includes(' ')))res.push({c,t:'like'})});
  return res;
}
function dupAsk(name,exceptId){
  const r=similar(name,exceptId);if(!r.length)return true;
  const list=r.slice(0,3).map(z=>'• '+(z.c.no?z.c.no+'. ':'')+z.c.name).join('\n');
  return confirm((r.some(z=>z.t==='same')?'⚠️ يوجد زبون بنفس الاسم:\n':'ℹ️ يوجد اسم مشابه:\n')+list+'\n\nإذا هو نفس الشخص اضغط «إلغاء» وافتح حسابه.\nوإذا شخص ثاني اضغط «موافق» للمتابعة.');
}
const nextNo=()=>S.customers.reduce((m,c)=>Math.max(m,c.no||0),0)+1;
function ensureNo(){let mx=0;S.customers.forEach(c=>{if(c.no>mx)mx=c.no});const miss=S.customers.filter(c=>!c.no).sort((a,b)=>a.id<b.id?-1:a.id>b.id?1:0);miss.forEach(c=>{c.no=++mx});return miss.length}
function addCustomer(){sheet('زبون جديد',[{k:'n',l:'الاسم'},{k:'p',l:'رقم الموبايل (اختياري)',t:'tel',m:'tel'},{k:'a',l:'دين أول (اختياري) — المبلغ',m:'decimal'},{k:'u',l:'العملة',o:[['IQD','دينار'],['USD','دولار']]},{k:'d',l:'اسم الحاجة / ملاحظة (مثلاً: راوتر، كيبل، اشتراك شهر)'},{k:'due',l:'تاريخ الاستحقاق (اختياري)',t:'date'}],v=>{
  if(!v.n){alert('اكتب اسم الزبون');return false}
  let a=0;if(v.a){a=num(v.a);if(!(a>0)){alert('اكتب مبلغاً صحيحاً أكبر من صفر، أو اترك الخانة فاضية');return false}}
  if(!dupAsk(v.n))return false;
  const c={id:uid(),no:nextNo(),name:v.n,phone:v.p,tx:[]};
  if(a>0)c.tx.push({id:uid(),type:'debt',cur:v.u,amt:a,note:v.d,due:v.due||'',ts:Date.now()});
  S.customers.push(c);save();render();
  if(a>0&&cfg.autoWa!=='0')waNote(c,'debt',a,v.u,v.d)})}
function addTx(type,id){
  if(!S.customers.length){alert('أضف زبوناً أولاً');return addCustomer()}
  const f=[];if(!id)f.push({k:'c',l:'الزبون',o:S.customers.map(c=>[c.id,c.name])});
  f.push({k:'a',l:'المبلغ',m:'decimal'},{k:'u',l:'العملة',o:[['IQD','دينار'],['USD','دولار']]});
  if(type==='debt')f.push({k:'due',l:'تاريخ الاستحقاق (اختياري)',t:'date'});
  f.push({k:'d',l:type==='debt'?'اسم الحاجة / ملاحظة (مثلاً: راوتر، كيبل، اشتراك شهر)':'ملاحظة (اختياري)'});
  sheet(type==='debt'?'تسجيل دين':'تسجيل تسديد',f,v=>{
    const c=S.customers.find(x=>x.id===(id||v.c)),a=num(v.a);
    if(!(a>0)){alert('اكتب مبلغاً صحيحاً أكبر من صفر');return false}
    const l=c.tx[c.tx.length-1];
    if(l&&l.type===type&&l.amt===a&&l.cur===v.u&&Date.now()-l.ts<120000&&!confirm('نفس المبلغ سُجّل قبل قليل. تسجله مرة ثانية؟'))return false;
    c.tx.push({id:uid(),type,cur:v.u,amt:a,note:v.d,due:v.due||'',ts:Date.now()});save();render();if(cfg.autoWa!=='0')waNote(c,type,a,v.u,type==='debt'?v.d:'')},type==='debt'?'سجّل الدين':'سجّل التسديد');
}
const sigBlock=()=>'\n\n✦ ━━━━━━━━━━ ✦\n🌐 *'+cfg.sig+'* 🌐\n✦ ━━━━━━━━━━ ✦'+(cfg.phone?'\n📞 '+cfg.phone:'');
function waNote(c,type,a,cur,note){
  let p=(c.phone||'').replace(/\D/g,'');if(!p)return;
  if(p.startsWith('0'))p='964'+p.slice(1);
  const r=balTxt(bal(c));
  const m='السلام عليكم '+c.name+'،\n'+(type==='debt'?'تم تسجيل دين بمبلغ '+fmt(a)+cu(cur)+(note?' ('+note+')':'')+'.':'تم استلام مبلغ '+fmt(a)+cu(cur)+'، شكراً لك.')+'\n'+(r==='مسدَّد'?'تم سداد كامل المبلغ، الله يعطيك العافية.':'المتبقي عليك: '+r)+sigBlock();
  window.open('https://wa.me/'+p+'?text='+encodeURIComponent(m),'_blank');
}
function editTx(c,id){
  const t=c.tx.find(x=>x.id===id);if(!t)return;
  const f=[{k:'a',l:'المبلغ',m:'decimal',v:String(t.amt)},{k:'u',l:'العملة',o:[['IQD','دينار'],['USD','دولار']],v:t.cur}];
  if(t.type==='debt')f.push({k:'due',l:'تاريخ الاستحقاق (اختياري)',t:'date',v:t.due||''});
  f.push({k:'d',l:t.type==='debt'?'اسم الحاجة / ملاحظة':'ملاحظة (اختياري)',v:t.note||''});
  sheet('تعديل '+(t.type==='debt'?'الدين':'التسديد'),f,v=>{
    const a=num(v.a);
    if(!(a>0)){alert('اكتب مبلغاً صحيحاً أكبر من صفر');return false}
    const ch=[];
    if(a!==t.amt||v.u!==t.cur)ch.push('المبلغ: '+fmt(t.amt)+cu(t.cur)+' ← '+fmt(a)+cu(v.u));
    if(t.type==='debt'&&(v.due||'')!==(t.due||''))ch.push('الاستحقاق: '+(t.due||'بدون')+' ← '+(v.due||'بدون'));
    if((v.d||'')!==(t.note||''))ch.push('الملاحظة: '+(t.note||'بدون')+' ← '+(v.d||'بدون'));
    if(!ch.length)return;
    if(!confirm('الخطوة 2 من 2: تأكيد التعديل؟\n\n'+ch.join('\n')))return false;
    t.amt=a;t.cur=v.u;t.note=v.d;if(t.type==='debt')t.due=v.due||'';
    save();render()},'التالي: مراجعة التعديل');
}
function wa(c,full){
  const b=bal(c);if(!full&&b.IQD<=0&&b.USD<=0){alert('الزبون ما عليه مبلغ');return}
  let p=(c.phone||'').replace(/\D/g,'');if(!p){alert('أضف رقم موبايل للزبون أولاً');return}
  if(p.startsWith('0'))p='964'+p.slice(1);
  let m='السلام عليكم '+c.name+'،\n';
  if(full){m+='كشف حسابك:\n'+c.tx.map(t=>new Date(t.ts).toLocaleDateString('en-GB')+' - '+(t.type==='debt'?'دين ':'تسديد ')+fmt(t.amt)+cu(t.cur)+(t.note?' ('+t.note+')':'')).join('\n')+'\nالمتبقي: '+balTxt(b)}
  else m+='تذكير ودّي: المبلغ المطلوب منك '+balTxt(b)+'. شكراً لتعاملك.';
  m+=sigBlock();
  window.open('https://wa.me/'+p+'?text='+encodeURIComponent(m),'_blank');
}
const whats=c=>{const n=[...new Set(opens(c).map(o=>o.note).filter(Boolean))];return n.length?n.slice(0,2).join('، ')+(n.length>2?' +'+(n.length-2):''):''};
const custRow=(c,btn)=>{const b=bal(c),o=opens(c).filter(isLate),amt=balTxt(b);return '<div class="row" data-id="'+c.id+'" tabindex="0"><div><div class="nm"><span class="num">'+(c.no||'')+'</span>'+esc(c.name)+'</div><div class="ph">'+(o.length?'<span class="late">متأخر '+o.length+'</span>':esc(c.phone||''))+'</div>'+(whats(c)?'<div class="what">🛒 '+esc(whats(c))+'</div>':'')+'</div><div style="display:flex;gap:8px;align-items:center"><div class="amt '+(b.IQD>0||b.USD>0?'owe':'ok')+'">'+amt+'</div>'+(btn&&(b.IQD>0||b.USD>0)?'<button class="wa" data-wa="'+c.id+'" aria-label="واتساب">واتساب</button>':'')+'</div></div>'};
function home(){
  const all=S.customers.flatMap(opens),late=all.filter(isLate),soon=all.filter(o=>o.due&&dueMs(o)>=T&&dueMs(o)<=T+7*D);
  const t={IQD:0,USD:0};S.customers.forEach(c=>{const b=bal(c);t.IQD+=Math.max(b.IQD,0);t.USD+=Math.max(b.USD,0)});
  const sum=a=>fmt(a.filter(o=>o.cur==='IQD').reduce((s,o)=>s+o.rem,0))+' د.ع';
  const fu=S.customers.filter(c=>{const b=bal(c);return b.IQD>0||b.USD>0}).sort((x,y)=>opens(y).filter(isLate).length-opens(x).filter(isLate).length||bal(y).IQD-bal(x).IQD).slice(0,5);
  const days=[...Array(7)].map((_,i)=>T-(6-i)*D),ch=days.map(d=>{let a=0,p=0;S.customers.forEach(c=>c.tx.forEach(x=>{if(x.cur==='IQD'&&x.ts>=d&&x.ts<d+D){x.type==='debt'?a+=x.amt:p+=x.amt}}));return{d,a,p}}),mx=Math.max(1,...ch.map(x=>Math.max(x.a,x.p)));
  const dn=['أحد','اثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'];
  return '<div class="hero"><small>إلك عند الزبائن</small><strong>'+fmt(t.IQD)+' د.ع</strong><em>'+fmt(t.USD)+' $</em></div>'
  +'<div class="stats"><div class="box"><small>متأخر</small><strong class="owe">'+sum(late)+'</strong></div><div class="box"><small>يستحق خلال 7 أيام</small><strong>'+sum(soon)+'</strong></div></div>'
  +'<h2>تحتاج متابعة</h2>'+(fu.length?'<div class="list">'+fu.map(c=>custRow(c,1)).join('')+'</div>':'<div class="box empty">ما كو ديون مفتوحة. اضغط + لتسجيل أول دين.</div>')
  +'<h2>آخر 7 أيام بالدينار</h2><div class="box"><div class="chart">'+ch.map(x=>'<div><div class="bars"><i style="height:'+x.a/mx*100+'%;background:var(--debt)"></i><i style="height:'+x.p/mx*100+'%;background:var(--pay)"></i></div>'+dn[new Date(x.d).getDay()]+'</div>').join('')+'</div><div class="ph" style="margin-top:6px"><span class="owe">■</span> ديون جديدة &nbsp; <span class="ok">■</span> تسديدات</div></div>';
}
function customers(){
  const L=S.customers.filter(c=>(c.name.includes(q)||String(c.no)===dig(q).trim())).sort((x,y)=>bal(y).IQD-bal(x).IQD);
  return '<input id="s" placeholder="ابحث عن زبون" value="'+esc(q)+'" style="margin-bottom:12px">'+(L.length?'<div class="list">'+L.map(c=>custRow(c)).join('')+'</div>':'<div class="box empty">'+(S.customers.length?'ما كو زبون بهذا الاسم.':'ما كو زبائن بعد. اضغط + وأضف زبون.')+'</div>')+'<button class="gold" id="nc" style="width:100%;margin-top:12px">زبون جديد</button>';
}
function dues(){
  const all=S.customers.flatMap(opens).sort((a,b)=>(a.due?dueMs(a):9e15)-(b.due?dueMs(b):9e15));
  return '<h2>الديون المفتوحة</h2>'+(all.length?'<div class="list">'+all.map(o=>'<div class="row" data-id="'+o.cid+'" tabindex="0"><div><div class="nm"><span class="num">'+(o.cno||'')+'</span>'+esc(o.cn)+'</div>'+(o.note?'<div class="what">🛒 '+esc(o.note)+'</div>':'')+(dueTxt(o)||'<span class="ph">بدون تاريخ</span>')+'</div><div class="amt owe">'+fmt(o.rem)+cu(o.cur)+'</div></div>').join('')+'</div>':'<div class="box empty">ما كو ديون مفتوحة.</div>');
}
function more(){return (user?'<h2>الحساب</h2><div class="box"><div class="nm">'+esc(user.email||'')+'</div><div class="ph">بياناتك محفوظة بالسحابة تحت هذا الحساب</div><button class="ghost" id="lo" style="margin-top:10px">تسجيل الخروج</button></div>':'<h2>الحساب</h2><div class="box"><div class="ph">أنت تعمل بدون حساب. البيانات على هذا الجهاز فقط.</div><button class="gold" id="li" style="margin-top:10px;width:100%">الدخول بحساب جوجل</button></div>')+'<h2>بيانات المحل</h2><div class="box"><div class="nm">'+esc(cfg.shop||'أحمد علوكه')+'</div><div class="ph">توقيع الرسائل: '+esc(cfg.sig)+(cfg.phone?' · '+esc(cfg.phone):'')+'</div><button class="ghost" id="cs" style="margin-top:10px">تعديل بيانات المحل</button></div><h2>النسخ الاحتياطي</h2><div class="acts"><button class="ghost" id="ex">نسخة احتياطية</button><button class="ghost" id="im">استرجاع نسخة</button></div><div class="box ph">'+(user?'بياناتك على السحابة. هذي نسخة إضافية على جوالك.':'البيانات محفوظة على هذا الجهاز فقط. خذ نسخة احتياطية من وقت لوقت.')+'</div>'}
function cust(c){
  const b=bal(c),op=opens(c);
  return '<button class="ghost" id="bk" style="margin-bottom:10px">رجوع</button><div class="box"><div class="nm"><span class="num">'+(c.no||'')+'</span>'+esc(c.name)+'</div><div class="ph">'+esc(c.phone||'بدون رقم')+'</div><strong class="'+(b.IQD>0||b.USD>0?'owe':'ok')+'" style="font-size:24px">'+balTxt(b)+'</strong></div>'
  +'<div class="acts"><button class="red" id="d">دين</button><button class="green" id="p">تسديد</button><button class="ghost" id="w">تذكير واتساب</button><button class="ghost" id="k">كشف حساب</button></div>'
  +'<div class="tabs"><button id="t1" class="'+(cvTab==='open'?'on':'')+'">المفتوح</button><button id="t2" class="'+(cvTab==='log'?'on':'')+'">السجل</button></div>'
  +(cvTab==='open'?(op.length?'<div class="list">'+op.map(o=>'<div class="tx"><div><b class="owe">'+fmt(o.rem)+cu(o.cur)+'</b>'+(o.note?'<div class="what">🛒 '+esc(o.note)+'</div>':'')+'<small>من '+fmt(o.amt)+' · '+new Date(o.ts).toLocaleDateString('en-GB')+'</small>'+dueTxt(o)+'</div><button data-e="'+o.id+'" style="color:var(--ink)" aria-label="تعديل">تعديل</button></div>').join('')+'</div>':'<div class="box empty">ما كو ديون مفتوحة على هذا الزبون.</div>')
  :(c.tx.length?'<div class="list">'+c.tx.slice().reverse().map(t=>'<div class="tx"><div><b class="'+(t.type==='debt'?'owe':'ok')+'">'+(t.type==='debt'?'دين ':'تسديد ')+fmt(t.amt)+cu(t.cur)+'</b><small>'+new Date(t.ts).toLocaleDateString('en-GB')+(t.note?' · '+esc(t.note):'')+'</small></div><div style="display:flex;gap:6px;align-self:center"><button data-e="'+t.id+'" style="color:var(--ink)" aria-label="تعديل">تعديل</button><button data-x="'+t.id+'" aria-label="حذف الحركة">حذف</button></div></div>').join('')+'</div>':'<div class="box empty">ما كو حركات بعد.</div>'))
  +'<div class="acts" style="margin-top:16px"><button class="ghost" id="ed">تعديل الزبون</button><button class="ghost" id="rm">حذف الزبون</button></div>';
}
const IC={home:'M3 11l9-8 9 8v10h-6v-6H9v6H3z',users:'M16 8a4 4 0 1 0-8 0 4 4 0 0 0 8 0zM4 21c0-4 4-6 8-6s8 2 8 6',dues:'M4 5h16v16H4zM4 10h16M9 3v4M15 3v4',more:'M5 12h.01M12 12h.01M19 12h.01'};
function render(){
  if(ensureNo())save();
  const hb=document.querySelector('header b');if(hb)hb.textContent=cfg.shop||'أحمد علوكه';
  const a=$('#app'),c=view&&S.customers.find(x=>x.id===view);if(view&&!c)view=null;
  a.innerHTML=c?cust(c):tab==='home'?home():tab==='cust'?customers():tab==='dues'?dues():more();
  const N=[['home','الرئيسية'],['cust','الزبائن'],0,['dues','الاستحقاق'],['more','المزيد']];
  $('#nav').innerHTML=N.map(n=>n?'<button data-tab="'+n[0]+'" class="'+(!c&&tab===n[0]?'on':'')+'"><svg viewBox="0 0 24 24"><path d="'+IC[n[0]==='cust'?'users':n[0]]+'"/></svg>'+n[1]+'</button>':'<button class="plus" id="pl" aria-label="إضافة">+</button>').join('');
  $('#nav').querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;view=null;q='';render();scrollTo(0,0)});
  $('#pl').onclick=()=>sheet('إضافة',[{k:'t',l:'شنو تريد تسجل؟',o:[['debt','دين جديد'],['pay','تسديد'],['cust','زبون جديد']]}],v=>{setTimeout(()=>v.t==='cust'?addCustomer():addTx(v.t),50)},'متابعة');
  a.querySelectorAll('.row').forEach(r=>{const go=()=>{view=r.dataset.id;cvTab='open';render();scrollTo(0,0)};r.onclick=go;r.onkeydown=e=>{if(e.key==='Enter')go()}});
  a.querySelectorAll('[data-wa]').forEach(b=>b.onclick=e=>{e.stopPropagation();wa(S.customers.find(x=>x.id===b.dataset.wa))});
  const s=$('#s');if(s)s.oninput=e=>{q=e.target.value;const p=e.target.selectionStart;render();const n=$('#s');n.focus();n.setSelectionRange(p,p)};
  if($('#nc'))$('#nc').onclick=addCustomer;
  if($('#lo'))$('#lo').onclick=()=>{if(confirm('تسجل الخروج؟ بياناتك محفوظة بالسحابة.')){try{localStorage.removeItem(KEY)}catch(e){}S={customers:[]};local.customers=[];signOut(auth)}};
  if($('#li'))$('#li').onclick=()=>{guest=false;showLogin()};
  if($('#cs'))$('#cs').onclick=()=>sheet('بيانات المحل',[{k:'s',l:'اسم المحل (يظهر بأعلى التطبيق)',v:cfg.shop||'أحمد علوكه'},{k:'g',l:'توقيع رسائل واتساب',v:cfg.sig},{k:'p',l:'رقم هاتفك للتواصل (اختياري)',t:'tel',m:'tel',v:cfg.phone},{k:'w',l:'فتح واتساب بعد كل دين أو تسديد',o:[['1','نعم'],['0','لا']],v:cfg.autoWa==='0'?'0':'1'}],v=>{cfg={shop:v.s,sig:v.g||cfg.sig,phone:v.p,autoWa:v.w};saveCfg();render()});
  if($('#ex'))$('#ex').onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));const l=document.createElement('a');l.href=u;l.download='alouka-backup-'+new Date().toISOString().slice(0,10)+'.json';l.click();setTimeout(()=>URL.revokeObjectURL(u),2000)};
  if($('#im'))$('#im').onclick=()=>{const i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>{const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.customers))throw 0;if(confirm('هذا يستبدل البيانات الحالية. تكمل؟')){S=d;save();render()}}catch(e){alert('الملف غير صالح')}};r.readAsText(i.files[0])};i.click()};
  if(c){
    $('#bk').onclick=()=>{view=null;render()};$('#d').onclick=()=>addTx('debt',c.id);$('#p').onclick=()=>addTx('pay',c.id);$('#w').onclick=()=>wa(c);$('#k').onclick=()=>wa(c,1);
    $('#t1').onclick=()=>{cvTab='open';render()};$('#t2').onclick=()=>{cvTab='log';render()};
    a.querySelectorAll('[data-x]').forEach(x=>x.onclick=()=>{if(confirm('تحذف هذه الحركة؟')){c.tx=c.tx.filter(t=>t.id!==x.dataset.x);save();render()}});
    a.querySelectorAll('[data-e]').forEach(x=>x.onclick=()=>editTx(c,x.dataset.e));
    $('#ed').onclick=()=>sheet('تعديل الزبون',[{k:'n',l:'الاسم',v:c.name},{k:'p',l:'رقم الموبايل',t:'tel',m:'tel',v:c.phone}],v=>{if(!v.n)return false;if(v.n!==c.name&&!dupAsk(v.n,c.id))return false;const ch=[];if(v.n!==c.name)ch.push('الاسم: '+c.name+' ← '+v.n);if(v.p!==(c.phone||''))ch.push('الرقم: '+(c.phone||'بدون')+' ← '+(v.p||'بدون'));if(!ch.length)return;if(!confirm('الخطوة 2 من 2: تأكيد التعديل؟\n\n'+ch.join('\n')))return false;c.name=v.n;c.phone=v.p;save();render()},'التالي: مراجعة التعديل');
    $('#rm').onclick=()=>{if(!confirm('الخطوة 1 من 2:\nتحذف الزبون «'+c.name+'» وكل حركاته؟'))return;if(!confirm('الخطوة 2 من 2 (تأكيد أخير):\nسيُحذف «'+c.name+'» نهائياً مع كل ديونه وتسديداته. المتبقي عليه: '+balTxt(bal(c))+'.\nلا يمكن التراجع. تحذفه؟'))return;S.customers=S.customers.filter(x=>x.id!==c.id);save();view=null;render()};
  }
}
function showLogin(){
  $('#nav').innerHTML='';
  $('#app').innerHTML='<div class="box" style="text-align:center;margin-top:30px;padding:24px"><b style="font-size:18px">سجّل دخولك لحفظ بياناتك</b><p class="ph" style="margin:10px 0 16px">زبائنك وديونك تنحفظ بحسابك على جوجل، وما تضيع حتى لو ضاع الجوال.</p><button class="gold" id="gl" style="width:100%">الدخول بحساب جوجل</button><p id="lerr" class="late" style="margin-top:10px"></p><button class="ghost" id="gs" style="width:100%;margin-top:14px">المتابعة بدون حساب (على هذا الجهاز فقط)</button></div>';
  $('#gl').onclick=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){if(e.code==='auth/popup-blocked')return signInWithRedirect(auth,new GoogleAuthProvider());$('#lerr').textContent='تعذّر تسجيل الدخول: '+(e.code||e.message)}};
  $('#gs').onclick=()=>{guest=true;render()};
}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
onAuthStateChanged(auth,u=>{
  if(unsub){unsub();unsub=null}
  if(unsubCfg){unsubCfg();unsubCfg=null}
  user=u;synced={};first=true;
  if(!u){local.customers=[];if(guest)render();else showLogin();return}
  unsubCfg=onSnapshot(doc(db,'users',u.uid,'settings','main'),s=>{if(s.exists()){cfg={...cfg,...s.data()};try{localStorage.setItem(CK,JSON.stringify(cfg))}catch(e){}render()}else if(cfg.shop||cfg.phone||cfg.sig!=='العلي لخدمات الإنترنت')saveCfg()},err=>console.error(err));
  unsub=onSnapshot(collection(db,'users',u.uid,'customers'),snap=>{
    const arr=snap.docs.map(d=>d.data());
    if(first){first=false;
      if(!arr.length&&local.customers.length){S=JSON.parse(JSON.stringify(local));save();render();return}}
    else if(snap.metadata.hasPendingWrites)return;
    S.customers=arr;synced={};arr.forEach(c=>synced[c.id]=JSON.stringify(c));
    try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
    render();
  },err=>{alert('تعذّر الاتصال بقاعدة البيانات: '+err.code)});
});
</script>
</body>
